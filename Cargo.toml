[package]
name = "owlpost"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "owl"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
data-encoding = "2"
ed25519-dalek = { version = "2", features = ["rand_core"] }
# rand_core: ed25519-dalek's own RNG trait crate; `getrandom` feature gives OsRng for key generation.
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v7", "serde"] }

[dev-dependencies]
tempfile = "3"
